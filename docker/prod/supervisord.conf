[unix_http_server]
file=/var/run/supervisor.sock
chmod=0766

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php]
command=/usr/local/sbin/php-fpm --nodaemonize
user=root
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:orchestrator]
command=php artisan queue:work --queue=orchestration --name=orchestrator --sleep=3 --tries=1 --max-time=3600
user=www-data
directory=/var/www/html
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/queue-orchestrator.log
stdout_logfile_maxbytes=10MB


[program:orchestrate-startup]
command=php artisan queue:orchestrate
user=www-data
directory=/var/www/html
autostart=true
autorestart=false
startsecs=0
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/orchestrate-startup.log
stdout_logfile_maxbytes=10MB

[program:Transcoder]
process_name=%(program_name)s_%(process_num)02d
command=php artisan queue:work --queue=transcode --name=Transcoder_%(process_num)02d --sleep=3 --tries=3 --max-time=3600
user=www-data
directory=/var/www/html
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=10
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/queue-transcoder.log
stdout_logfile_maxbytes=10MB

[program:ExtractSubs]
process_name=%(program_name)s_%(process_num)02d
command=php artisan queue:work --queue=subtitle --name=ExtractSubs_%(process_num)02d --sleep=3 --tries=3 --max-time=3600
user=www-data
directory=/var/www/html
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=10
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/queue-extractsubs.log
stdout_logfile_maxbytes=10MB

[program:ConvertSubs]
process_name=%(program_name)s_%(process_num)02d
command=php artisan queue:work --queue=convert-subs --name=ConvertSubs_%(process_num)02d --sleep=3 --tries=3 --max-time=3600
user=www-data
directory=/var/www/html
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=10
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/queue-convertsubs.log
stdout_logfile_maxbytes=10MB
