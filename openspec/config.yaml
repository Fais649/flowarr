schema: spec-driven

context: |
  Tech stack: PHP 8.5, Laravel 13, Inertia v3 + React 19, TypeScript, Tailwind v4, PostgreSQL 18, Redis 7, shadcn/ui
  Testing: Pest (PHP feature tests), Playwright (browser tests), Vitest (frontend unit tests)
  Task completion gate: Before marking any task as complete, the implementer MUST:
    1. Run the CI workflow locally (vendor/bin/sail artisan test, vendor/bin/sail bun run build)
    2. Confirm all tests pass (green)
    3. Commit changes with a descriptive message
    4. Push to the remote repository
    5. Verify the remote CI run is green
    Tasks that do not pass this gate are NOT considered complete.
